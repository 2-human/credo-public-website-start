<!DOCTYPE html>
<html lang="en" data-asset-base="../../../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Debt — Reduce or Remove — Credo Legal</title>
<link rel="stylesheet" href="../../../shared/style.css">
</head>
<body>
<div id="app"></div>

<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (!app) return;
  if (app.innerHTML.length > 100) return;
  app.innerHTML = '<div style="padding:24px;font-family:monospace;background:#fee;border:2px solid #c33;margin:20px;border-radius:8px;line-height:1.5">'
    + '<h2 style="margin-top:0;color:#c33">JS error caught</h2>'
    + '<p><strong>Message:</strong> ' + (e.message || '(no message)') + '</p>'
    + '<p><strong>Source:</strong> ' + (e.filename || '(unknown)') + ' line ' + (e.lineno || '?') + '</p>'
    + '<p><strong>Stack:</strong></p><pre style="background:white;padding:10px;border-radius:4px;overflow:auto;font-size:12px">' + (e.error && e.error.stack ? e.error.stack.replace(/[<>]/g, '?') : '(no stack)') + '</pre>'
    + '<p style="color:#888;font-size:12px">window.LP_CONTENT: <code>' + (typeof window.LP_CONTENT !== 'undefined') + '</code> | window.VARIANTS: <code>' + (typeof window.VARIANTS !== 'undefined') + '</code> | window.renderVariantPage: <code>' + (typeof window.renderVariantPage !== 'undefined') + '</code></p>'
    + '</div>';
});
</script>
<script src="../../../shared/data.js"></script>
<script src="../../../shared/lp-content.js"></script>
<script src="../../../shared/variants.js"></script>
<script src="../../../shared/lp-template.js"></script>
<script src="../../../shared/variant-template.js"></script>
<script>
try { renderVariantPage({ variant: 'reduce-or-remove', type: 'service', cluster: 'medicalDebt', base: '../' }); }
catch (err) { document.getElementById('app').innerHTML = '<div style="padding:24px;color:#c33;font-family:monospace"><h2>renderVariantPage threw</h2><p>' + err.message + '</p><pre>' + (err.stack||'').replace(/[<>]/g,'?') + '</pre></div>'; }
</script>
</body>
</html>
