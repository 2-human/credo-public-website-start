<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (!app) return;
  if (app.innerHTML.length > 100) return;  // already rendered fine
  app.innerHTML = '<div style="padding:24px;font-family:monospace;background:#fee;border:2px solid #c33;margin:20px;border-radius:8px;color:#1a1a1a;line-height:1.5">'
    + '<h2 style="margin-top:0;color:#c33">JS error caught (page would otherwise be blank)</h2>'
    + '<p><strong>Message:</strong> ' + (e.message || '(no message)') + '</p>'
    + '<p><strong>Source:</strong> ' + (e.filename || '(unknown)') + ' line ' + (e.lineno || '?') + '</p>'
    + '<p><strong>Stack:</strong></p><pre style="background:white;padding:10px;border-radius:4px;overflow:auto;font-size:12px">' + (e.error && e.error.stack ? e.error.stack.replace(/[<>]/g, '?') : '(no stack)') + '</pre>'
    + '<p style="color:#888;font-size:12px">window.LP_CONTENT loaded: <code>' + (typeof window.LP_CONTENT !== 'undefined') + '</code> | window.CredoNav: <code>' + (typeof window.CredoNav !== 'undefined') + '</code> | window.renderLP: <code>' + (typeof window.renderLP !== 'undefined') + '</code></p>'
    + '</div>';
});
</script>
<script src="../../shared/data.js"></script>
<script src="../../shared/lp-content.js"></script>
<script src="../../shared/lp-template.js"></script>

try { renderLP('med-debt-rights-var-a-education', '../../'); }

}
</script>
